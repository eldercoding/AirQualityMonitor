<!DOCTYPE html>
<html lang="sr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Vazduha</title>
    <!-- Tailwind CSS sa konfiguracijom za klasnu tamnu temu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js za iscrtavanje grafikona -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Adapter za datume (neophodan za vremensku osu) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans p-6 transition-colors duration-200">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Zaglavlje sa dugmetom za Dark Mode -->
        <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl border dark:border-gray-700 border-gray-100 shadow-md transition-colors duration-200">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Monitoring Vazduha</h1>
            </div>
            <button id="theme-toggle" class="p-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-gray-600 transition focus:outline-none">
                <span id="theme-icon" class="text-xl">☀️</span>
            </button>
        </div>

        <!-- Upozorenje ako je poslednje očitavanje starije od sat vremena -->
        <div id="alert-banner" class="hidden bg-amber-50 dark:bg-amber-950/40 border-l-4 border-amber-500 text-amber-700 dark:text-amber-400 p-4 rounded-xl shadow-md transition-colors duration-200">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚠️</span>
                <div>
                    <p class="font-semibold">Upozorenje</p>
                    <p id="alert-text" class="text-sm">Poslednje očitavanje je starije od sat vremena!</p>
                </div>
            </div>
        </div>
        
        <!-- Sekcija: Poslednje merenje na vrhu -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border-blue-500 dark:border-blue-400 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                <div class="flex items-center gap-3 flex-wrap">
                    <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200">Poslednje merenje: </h2>
                    <span id="header-air-quality-badge" class="hidden"></span>
                </div>
            </div>
            <div id="latest-content" class="text-gray-500 dark:text-gray-400">Učitavanje podataka...</div>
        </div>

        <!-- Sekcija: Izbor vremenskog opsega za grafike -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-4 border border-gray-100 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4 transition-colors duration-200">
            <span class="font-semibold text-gray-700 dark:text-gray-200">Vremenski opseg grafikona:</span>
            <select id="timeRange" class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-gray-100 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                <option value="6h" selected>Poslednjih 6 sati</option>
                <option value="1d">Poslednji dan</option>
                <option value="1w">Poslednja nedelja</option>
                <option value="1m">Poslednji mesec</option>
                <option value="1y">Poslednja godina</option>
            </select>
        </div>

        <!-- Sekcija: Grafikon za zagađenje -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Kretanje zagađenja kroz vreme</h2>
            <div class="relative h-80">
                <canvas id="pollutionChart"></canvas>
            </div>
        </div>

        <!-- Sekcija: Grafikon za temperaturu -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Kretanje temperature kroz vreme</h2>
            <div class="relative h-80">
                <canvas id="temperatureChart"></canvas>
            </div>
        </div>

        <!-- Sekcija: Grafikon za pritisak -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Kretanje pritiska kroz vreme</h2>
            <div class="relative h-80">
                <canvas id="pressureChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- VAŠI SUPABASE PODACI ---
        const SUPABASE_URL = 'https://dlyfovkjrjndiddhcdad.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IsHJi8QNueg8fBGdJn_xqw_1OH0mjbS';

        // Inicijalizacija Supabase klijenta
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let pollutionChartInstance = null;
        let temperatureChartInstance = null;
        let pressureChartInstance = null;
        let globalData = [];

        // --- POMOĆNA FUNKCIJA ZA KVALITET VAZDUHA NA OSNOVU PM 2.5 ---
        function getAirQualityStatus(pm25, pm10) {
            //pm25 = 77;
            if (pm25 === null || pm25 === undefined || pm10 === null || pm10 === undefined) return { text: 'Nepoznato', class: '' };
            if (pm25 <= 10 && pm10 <= 20) return { text: 'Odličan 😄', class: 'text-green-500' };
            if (pm25 <= 20 && pm10 <= 40) return { text: 'Prihvatljiv 🙂', class: 'text-yellow-500' };
            if (pm25 <= 25 && pm10 <= 50) return { text: 'Umeren 😐', class: 'text-orange-500' };
            if (pm25 <= 50 && pm10 <= 100) return { text: 'Loš ☹️', class: 'text-red-500' };
            if (pm25 <= 75 && pm10 <= 150) return { text: 'Veoma loš 😶', class: 'text-purple-600' };
            return { text: 'Opasan 😵', class: 'text-red-900' };
        }

        // --- UPRAVLJANJE TEMOM (DARK/LIGHT MODE) ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;
        const timeRangeSelect = document.getElementById('timeRange');

        updateThemeIcon();

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            updateThemeIcon();
            if (globalData.length > 0) {
                const range = timeRangeSelect.value;
                renderCharts(globalData, getStartDate(range), range);
            }
        });

        timeRangeSelect.addEventListener('change', () => {
            fetchData();
        });

        function updateThemeIcon() {
            if (htmlElement.classList.contains('dark')) {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        }

        // Izračunavanje početnog datuma na osnovu izabranog opsega
        function getStartDate(range) {
            const now = new Date();
            switch (range) {
                case '6h':
                    return new Date(now.getTime() - 6 * 60 * 60 * 1000);
                case '1d':
                    return new Date(now.getTime() - 24 * 60 * 60 * 1000);
                case '1w':
                    return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                case '1m':
                    return new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                case '1y':
                    return new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
                default:
                    return new Date(now.getTime() - 6 * 60 * 60 * 1000);
            }
        }

        // Funkcija za proređivanje podataka (downsampling) da grafi ostanu pregledni
        function downsampleData(data, maxPoints = 200) {
            if (data.length <= maxPoints) return data;
            const factor = Math.ceil(data.length / maxPoints);
            return data.filter((_, index) => index % factor === 0);
        }

        // Određivanje vremenske jedinice za osu X na osnovu opsega
        function getTimeUnit(range) {
            switch (range) {
                case '6h':
                case '1d':
                    return 'hour';
                case '1w':
                case '1m':
                    return 'day';
                case '1y':
                    return 'month';
                default:
                    return 'day';
            }
        }

        // --- PREUZIMANJE PODATAKA ---
        async function fetchData() {
            const selectedRange = timeRangeSelect.value;
            const startDate = getStartDate(selectedRange);

            const { data, error } = await supabaseClient
                .from('sensor_readings')
                .select('*')
                .gte('measurement_time', startDate.toISOString())
                .order('measurement_time', { ascending: false });

            const alertBanner = document.getElementById('alert-banner');
            const headerBadge = document.getElementById('header-air-quality-badge');

            if (error) {
                console.error('Greška pri preuzimanju:', error);
                document.getElementById('latest-content').innerHTML = '<p class="text-red-500">Greška pri učitavanju podataka iz baze.</p>';
                headerBadge.classList.add('hidden');
                return;
            }

            if (!data || data.length === 0) {
                document.getElementById('latest-content').innerHTML = '<p class="text-gray-500">Nema pronađenih merenja za izabrani period.</p>';
                alertBanner.classList.add('hidden');
                headerBadge.classList.add('hidden');
                globalData = [];
                
                if (pollutionChartInstance) { pollutionChartInstance.destroy(); pollutionChartInstance = null; }
                if (temperatureChartInstance) { temperatureChartInstance.destroy(); temperatureChartInstance = null; }
                if (pressureChartInstance) { pressureChartInstance.destroy(); pressureChartInstance = null; }
                return;
            }

            globalData = data;

            // 1. Provera starosti poslednjeg očitavanja
            const latest = data[0];
            const latestTime = new Date(latest.measurement_time).getTime();
            const now = new Date().getTime();
            const diffMs = now - latestTime;
            const diffHours = diffMs / (1000 * 60 * 60);

            const alertText = document.getElementById('alert-text');

            if (diffHours > 1) {
                alertBanner.classList.remove('hidden');
                const hoursAgo = diffHours.toFixed(1);
                alertText.textContent = `Poslednje očitavanje je napravljeno pre ${hoursAgo} sati.`;
            } else {
                alertBanner.classList.add('hidden');
            }

            const dateStr = latest.measurement_time 
                ? new Date(latest.measurement_time).toLocaleString('sr-RS') 
                : 'Nepoznato vreme';

            // Dobijanje statusa kvaliteta vazduha na osnovu pm2_5
            const airQuality = getAirQualityStatus(latest.pm2_5, latest.pm10);

            // Prikaz/popunjavanje bedža kvaliteta u zaglavlju pored naslova
            if (diffHours > 24) {
                headerBadge.classList.add('hidden');
            } else {
                headerBadge.className = `text-xl tracking-wider font-extrabold ${airQuality.class}`;
                headerBadge.textContent = airQuality.text;
                headerBadge.classList.remove('hidden');
            }

            // 2. Prikaz poslednjeg merenja na vrhu (bez oznake "Kvalitet")
            if (diffHours > 24) {
                document.getElementById('latest-content').innerHTML = `
                    <div class="text-center py-4 bg-gray-50 dark:bg-gray-700/30 rounded-lg border border-dashed border-gray-300 dark:border-gray-600">
                        <p class="text-amber-600 dark:text-amber-400 font-semibold mb-1">Nema merenja u poslednja 24 sata</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Poslednje zabeleženo očitavanje bilo je: ${dateStr} (pre ${diffHours.toFixed(1)} sati)</p>
                    </div>
                `;
            } else {
                document.getElementById('latest-content').innerHTML = `
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mb-1">Vreme: <span class="font-medium text-gray-800 dark:text-gray-200">${dateStr}</span></p>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Senzor: <span class="font-medium text-gray-800 dark:text-gray-200">${latest.sensor_id || '-'}</span></p>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 w-full md:w-auto">
                            <div class="p-1 text-center">
                                <span class="block text-xs text-gray-500 dark:text-gray-400">PM 1.0</span>
                                <span class="text-lg font-bold text-gray-800 dark:text-gray-100">${latest.pm1 ?? '-'}</span>
                                <span class="text-xs text-gray-400">µg/m³</span>
                            </div>
                            <div class="p-1 text-center">
                                <span class="block text-xs text-purple-600 dark:text-purple-400">PM 2.5</span>
                                <span class="text-lg font-bold text-purple-600 dark:text-purple-400">${latest.pm2_5 ?? '-'}</span>
                                <span class="text-xs text-purple-400/80">µg/m³</span>
                            </div>
                            <div class="p-1 text-center">
                                <span class="block text-xs text-yellow-600 dark:text-yellow-400">PM 10</span>
                                <span class="text-lg font-bold text-yellow-600 dark:text-yellow-400">${latest.pm10 ?? '-'}</span>
                                <span class="text-xs text-yellow-400/80">µg/m³</span>
                            </div>
                            <div class="p-1 text-center">
                                <span class="block text-xs text-blue-600 dark:text-blue-400">Temperatura</span>
                                <span class="text-lg font-bold text-blue-600 dark:text-blue-400">${latest.temperature ?? '-'}</span>
                                <span class="text-xs text-blue-400/80">°C</span>
                            </div>
                            <div class="p-1 text-center">
                                <span class="block text-xs text-green-600 dark:text-green-400">Pritisak</span>
                                <span class="text-lg font-bold text-green-600 dark:text-green-400">${latest.pressure ?? '-'}</span>
                                <span class="text-xs text-green-400/80">hPa</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 3. Primena downsampling-a i iscrtavanje grafikona
            const processedData = downsampleData(data);
            renderCharts(processedData, startDate, selectedRange);
        }

        // --- ISCRTAVANJE GRAFIKONA ---
        function renderCharts(data, startDate, range) {
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#9ca3af' : '#4b5563';
            const gridColor = isDark ? 'rgba(75, 85, 99, 0.2)' : 'rgba(229, 231, 235, 1)';

            const minTime = startDate.toISOString();
            const maxTime = new Date().toISOString();
            const timeUnit = getTimeUnit(range);

            // 1. Grafik zagađenja
            const ctxPollution = document.getElementById('pollutionChart').getContext('2d');
            if (pollutionChartInstance) pollutionChartInstance.destroy();

            pollutionChartInstance = new Chart(ctxPollution, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'PM 1.0',
                            data: data.map(row => ({ x: row.measurement_time, y: row.pm1 })),
                            borderColor: isDark ? '#9ca3af' : '#6b7280',
                            backgroundColor: isDark ? 'rgba(156, 163, 175, 0.1)' : 'rgba(107, 114, 128, 0.1)',
                            tension: 0.3
                        },
                        {
                            label: 'PM 2.5',
                            data: data.map(row => ({ x: row.measurement_time, y: row.pm2_5 })),
                            borderColor: '#a855f7',
                            backgroundColor: 'rgba(168, 85, 247, 0.1)',
                            tension: 0.3
                        },
                        {
                            label: 'PM 10',
                            data: data.map(row => ({ x: row.measurement_time, y: row.pm10 })),
                            borderColor: '#eab308',
                            backgroundColor: 'rgba(234, 179, 8, 0.1)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeUnit,
                                tooltipFormat: 'dd.MM.yyyy HH:mm',
                                displayFormats: { hour: 'HH:mm', day: 'dd.MM.', month: 'MMM yyyy' }
                            },
                            min: minTime,
                            max: maxTime,
                            ticks: { color: textColor },
                            grid: { color: gridColor }
                        },
                        y: { beginAtZero: true, ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: 'µg/m³', color: textColor } }
                    }
                }
            });

            // 2. Grafik temperature
            const ctxTemp = document.getElementById('temperatureChart').getContext('2d');
            if (temperatureChartInstance) temperatureChartInstance.destroy();

            temperatureChartInstance = new Chart(ctxTemp, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Temperatura',
                            data: data.map(row => ({ x: row.measurement_time, y: row.temperature })),
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeUnit,
                                tooltipFormat: 'dd.MM.yyyy HH:mm',
                                displayFormats: { hour: 'HH:mm', day: 'dd.MM.', month: 'MMM yyyy' }
                            },
                            min: minTime,
                            max: maxTime,
                            ticks: { color: textColor },
                            grid: { color: gridColor }
                        },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: '°C', color: textColor } }
                    }
                }
            });

            // 3. Grafik pritiska
            const ctxPressure = document.getElementById('pressureChart').getContext('2d');
            if (pressureChartInstance) pressureChartInstance.destroy();

            pressureChartInstance = new Chart(ctxPressure, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Pritisak',
                            data: data.map(row => ({ x: row.measurement_time, y: row.pressure })),
                            borderColor: '#22c55e',
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: timeUnit,
                                tooltipFormat: 'dd.MM.yyyy HH:mm',
                                displayFormats: { hour: 'HH:mm', day: 'dd.MM.', month: 'MMM yyyy' }
                            },
                            min: minTime,
                            max: maxTime,
                            ticks: { color: textColor },
                            grid: { color: gridColor }
                        },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: 'hPa', color: textColor } }
                    }
                }
            });
        }

        // Pokreni učitavanje jednom pri učitavanju stranice
        fetchData();
    </script>
</body>
</html>
