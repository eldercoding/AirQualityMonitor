<!DOCTYPE html>
<html lang="sr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Vazduha</title>
    <!-- Tailwind CSS sa konfiguracijom za klasnu tamnu temu -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js za iscrtavanje grafikona -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans p-6 transition-colors duration-200">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Zaglavlje sa dugmetom za Dark Mode -->
        <div class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded-xl border dark:border-gray-700 border-gray-100 shadow-md transition-colors duration-200">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Monitoring Vazduha</h1>
            </div>
            <button id="theme-toggle" class="p-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-gray-600 transition focus:outline-none">
                <span id="theme-icon" class="text-xl">☀️</span>
            </button>
        </div>

        <!-- Upozorenje ako je poslednje očitavanje starije od sat vremena -->
        <div id="alert-banner" class="hidden bg-amber-50 dark:bg-amber-950/40 border-l-4 border-amber-500 text-amber-700 dark:text-amber-400 p-4 rounded-xl shadow-md transition-colors duration-200">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚠️</span>
                <div>
                    <p class="font-semibold">Upozorenje</p>
                    <p id="alert-text" class="text-sm">Poslednje očitavanje je starije od sat vremena!</p>
                </div>
            </div>
        </div>
        
        <!-- Sekcija: Poslednje merenje na vrhu -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border-blue-500 dark:border-blue-400 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Poslednje merenje</h2>
            <div id="latest-content" class="text-gray-500 dark:text-gray-400">Učitavanje podataka...</div>
        </div>

        <!-- Sekcija: Grafikon za zagađenje -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Kretanje zagađenja kroz vreme (Poslednje 2 nedelje)</h2>
            <div class="relative h-80">
                <canvas id="pollutionChart"></canvas>
            </div>
        </div>

        <!-- Sekcija: Grafikon za temperaturu -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Kretanje temperature kroz vreme (Poslednje 2 nedelje)</h2>
            <div class="relative h-80">
                <canvas id="temperatureChart"></canvas>
            </div>
        </div>

        <!-- Sekcija: Grafikon za pritisak -->
        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 border border-gray-100 dark:border-gray-700 transition-colors duration-200">
            <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-200 mb-4">Kretanje pritiska kroz vreme (Poslednje 2 nedelje)</h2>
            <div class="relative h-80">
                <canvas id="pressureChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- VAŠI SUPABASE PODACI ---
        const SUPABASE_URL = 'https://dlyfovkjrjndiddhcdad.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IsHJi8QNueg8fBGdJn_xqw_1OH0mjbS';

        // Inicijalizacija Supabase klijenta
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let pollutionChartInstance = null;
        let temperatureChartInstance = null;
        let pressureChartInstance = null;
        let globalData = [];

        // --- UPRAVLJANJE TEMOM (DARK/LIGHT MODE) ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        updateThemeIcon();

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            updateThemeIcon();
            if (globalData.length > 0) {
                renderCharts(globalData);
            }
        });

        function updateThemeIcon() {
            if (htmlElement.classList.contains('dark')) {
                themeIcon.textContent = '☀️';
            } else {
                themeIcon.textContent = '🌙';
            }
        }

        // --- PREUZIMANJE PODATAKA ---
        async function fetchData() {
            const twoWeeksAgo = new Date();
            twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);

            const { data, error } = await supabaseClient
                .from('sensor_readings')
                .select('*')
                .gte('measurement_time', twoWeeksAgo.toISOString())
                .order('measurement_time', { ascending: false });

            if (error) {
                console.error('Greška pri preuzimanju:', error);
                document.getElementById('latest-content').innerHTML = '<p class="text-red-500">Greška pri učitavanju podataka iz baze.</p>';
                return;
            }

            if (!data || data.length === 0) {
                document.getElementById('latest-content').innerHTML = '<p class="text-gray-500">Nema pronađenih merenja u poslednje dve nedelje.</p>';
                return;
            }

            globalData = data;

            // 1. Provera da li je poslednje očitavanje starije od sat vremena
            const latest = data[0];
            const latestTime = new Date(latest.measurement_time).getTime();
            const now = new Date().getTime();
            const diffMs = now - latestTime;
            const diffHours = diffMs / (1000 * 60 * 60);

            const alertBanner = document.getElementById('alert-banner');
            const alertText = document.getElementById('alert-text');

            if (diffHours > 1) {
                alertBanner.classList.remove('hidden');
                const hoursAgo = diffHours.toFixed(1);
                alertText.textContent = `Poslednje očitavanje je napravljeno pre ${hoursAgo} sati (starije od 1 sat).`;
            } else {
                alertBanner.classList.add('hidden');
            }

            // 2. Prikaz poslednjeg merenja (sa ažuriranim bojama)
            const dateStr = latest.measurement_time 
                ? new Date(latest.measurement_time).toLocaleString('sr-RS') 
                : 'Nepoznato vreme';

            document.getElementById('latest-content').innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Vreme: <span class="font-medium text-gray-800 dark:text-gray-200">${dateStr}</span></p>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Senzor: <span class="font-medium text-gray-800 dark:text-gray-200">${latest.sensor_id || '-'}</span></p>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 w-full md:w-auto">
                        <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg text-center border dark:border-gray-600">
                            <span class="block text-xs text-gray-500 dark:text-gray-400">PM 1.0</span>
                            <span class="text-lg font-bold text-gray-800 dark:text-gray-100">${latest.pm1 ?? '-'}</span>
                            <span class="text-xs text-gray-400">µg/m³</span>
                        </div>
                        <!-- PM 2.5 u ljubičastoj boji -->
                        <div class="bg-purple-50 dark:bg-purple-950/40 p-3 rounded-lg text-center border border-purple-200 dark:border-purple-800">
                            <span class="block text-xs text-purple-600 dark:text-purple-400">PM 2.5</span>
                            <span class="text-lg font-bold text-purple-600 dark:text-purple-400">${latest.pm2_5 ?? '-'}</span>
                            <span class="text-xs text-purple-400/80">µg/m³</span>
                        </div>
                        <!-- PM 10 u žutoj boji -->
                        <div class="bg-yellow-50 dark:bg-yellow-950/40 p-3 rounded-lg text-center border border-yellow-200 dark:border-yellow-800">
                            <span class="block text-xs text-yellow-600 dark:text-yellow-400">PM 10</span>
                            <span class="text-lg font-bold text-yellow-600 dark:text-yellow-400">${latest.pm10 ?? '-'}</span>
                            <span class="text-xs text-yellow-400/80">µg/m³</span>
                        </div>
                        <!-- Temperatura u plavoj boji -->
                        <div class="bg-blue-50 dark:bg-blue-950/40 p-3 rounded-lg text-center border border-blue-200 dark:border-blue-800">
                            <span class="block text-xs text-blue-600 dark:text-blue-400">Temperatura</span>
                            <span class="text-lg font-bold text-blue-600 dark:text-blue-400">${latest.temperature ?? '-'}</span>
                            <span class="text-xs text-blue-400/80">°C</span>
                        </div>
                        <!-- Pritisak u zelenoj boji -->
                        <div class="bg-green-50 dark:bg-green-950/40 p-3 rounded-lg text-center border border-green-200 dark:border-green-800">
                            <span class="block text-xs text-green-600 dark:text-green-400">Pritisak</span>
                            <span class="text-lg font-bold text-green-600 dark:text-green-400">${latest.pressure ?? '-'}</span>
                            <span class="text-xs text-green-400/80">hPa</span>
                        </div>
                    </div>
                </div>
            `;

            // 3. Iscrtavanje svih grafikona
            renderCharts(data);
        }

        // --- ISCRTAVANJE GRAFIKONA ---
        function renderCharts(data) {
            const chartData = [...data].reverse();
            const labels = chartData.map(row => {
                const d = new Date(row.measurement_time);
                return d.toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString('sr-RS', { day: '2-digit', month: '2-digit' });
            });

            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#9ca3af' : '#4b5563';
            const gridColor = isDark ? 'rgba(75, 85, 99, 0.2)' : 'rgba(229, 231, 235, 1)';

            // 1. Grafik zagađenja
            const ctxPollution = document.getElementById('pollutionChart').getContext('2d');
            if (pollutionChartInstance) pollutionChartInstance.destroy();

            pollutionChartInstance = new Chart(ctxPollution, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'PM 1.0',
                            data: chartData.map(row => row.pm1),
                            borderColor: isDark ? '#9ca3af' : '#6b7280',
                            backgroundColor: isDark ? 'rgba(156, 163, 175, 0.1)' : 'rgba(107, 114, 128, 0.1)',
                            tension: 0.3
                        },
                        {
                            label: 'PM 2.5',
                            data: chartData.map(row => row.pm2_5),
                            borderColor: '#a855f7', // Ljubičasta boja
                            backgroundColor: 'rgba(168, 85, 247, 0.1)',
                            tension: 0.3
                        },
                        {
                            label: 'PM 10',
                            data: chartData.map(row => row.pm10),
                            borderColor: '#eab308', // Žuta boja
                            backgroundColor: 'rgba(234, 179, 8, 0.1)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { beginAtZero: true, ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: 'µg/m³', color: textColor } }
                    }
                }
            });

            // 2. Grafik temperature (Plava boja)
            const ctxTemp = document.getElementById('temperatureChart').getContext('2d');
            if (temperatureChartInstance) temperatureChartInstance.destroy();

            temperatureChartInstance = new Chart(ctxTemp, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Temperatura',
                            data: chartData.map(row => row.temperature),
                            borderColor: '#3b82f6', // Plava boja
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: '°C', color: textColor } }
                    }
                }
            });

            // 3. Grafik pritiska (Zelena boja)
            const ctxPressure = document.getElementById('pressureChart').getContext('2d');
            if (pressureChartInstance) pressureChartInstance.destroy();

            pressureChartInstance = new Chart(ctxPressure, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Pritisak',
                            data: chartData.map(row => row.pressure),
                            borderColor: '#22c55e', // Zelena boja
                            backgroundColor: 'rgba(34, 197, 94, 0.1)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: 'hPa', color: textColor } }
                    }
                }
            });
        }

        // Pokreni učitavanje
        fetchData();

        // Osvežavanje na svakih 30 sekundi
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
